<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Una canción para ti ♡</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #666666;
    font-family: Georgia, "Times New Roman", serif;
    color: #222222;
    padding: 20px;
}

.card {
    width: 100%;
    max-width: 430px;
    background: #eeeeee;
    padding: 42px 28px;
    text-align: center;
    border-top: 7px solid #e9002b;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
}

.heart {
    color: #e9002b;
    font-size: 25px;
    margin-bottom: 10px;
}

h1 {
    margin: 0;
    font-family: Arial, sans-serif;
    font-size: 25px;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.subtitle {
    margin: 12px 0 30px;
    font-family: Arial, sans-serif;
    font-size: 13px;
    color: #666666;
}

.song {
    font-size: 25px;
    line-height: 1.4;
    font-weight: bold;
    margin: 20px 5px 8px;
}

.artist {
    font-family: Arial, sans-serif;
    font-size: 14px;
    color: #e9002b;
    font-weight: bold;
    margin-bottom: 30px;
}

button {
    border: none;
    background: #e9002b;
    color: white;
    padding: 13px 22px;
    font-family: Arial, sans-serif;
    font-weight: bold;
    cursor: pointer;
    letter-spacing: 1px;
}

.footer {
    margin-top: 30px;
    font-family: Arial, sans-serif;
    font-size: 11px;
    color: #888888;
}

</style>
</head>

<body>

<div class="card">

    <div class="heart">♡</div>

    <h1>Una canción para ti</h1>

    <div class="subtitle">
        Quizás necesitabas escuchar esto hoy...
    </div>

    <div class="song" id="song">
        ♫
    </div>

    <div class="artist">
        BTS
    </div>

    <button onclick="openSong()">
        💜 ESCUCHAR EN SPOTIFY
    </button>

    <div class="footer">
        Que esta canción te encuentre cuando la necesites. ♡
    </div>

</div>

<script>

const songs = [

    /* 💜 ARIRANG */

    { name: "Body to Body" },
    { name: "Hooligan" },
    { name: "Aliens" },
    { name: "FYA" },
    { name: "2.0" },
    { name: "No. 29" },
    { name: "SWIM" },
    { name: "Merry Go Round" },
    { name: "NORMAL" },
    { name: "Like Animals" },
    { name: "they don't know 'bout us" },
    { name: "One More Night" },
    { name: "Please" },
    { name: "Into the Sun" },

    /* 🌙 BTS — diferentes eras */

    { name: "Spring Day" },
    { name: "Magic Shop" },
    { name: "Mikrokosmos" },
    { name: "Euphoria" },
    { name: "Answer : Love Myself" },
    { name: "Life Goes On" },
    { name: "The Truth Untold" },
    { name: "Blue & Grey" },
    { name: "We Are Bulletproof : the Eternal" },
    { name: "00:00 (Zero O'Clock)" },
    { name: "Friends" },
    { name: "Filter" },
    { name: "Dynamite" },
    { name: "Butter" },
    { name: "Yet To Come" },
    { name: "Run BTS" },
    { name: "FAKE LOVE" },
    { name: "IDOL" },
    { name: "DNA" },
    { name: "MIC Drop" },
    { name: "Not Today" },
    { name: "Dope" },
    { name: "Save ME" },
    { name: "I NEED U" },
    { name: "Blood Sweat & Tears" },
    { name: "Burning Up (Fire)" },
    { name: "ON" },
    { name: "Black Swan" },
    { name: "Boy With Luv" },
    { name: "Home" },
    { name: "Make It Right" },
    { name: "Pied Piper" },
    { name: "Go Go" },
    { name: "Best Of Me" },
    { name: "Run" },
    { name: "Young Forever" },
    { name: "Whalien 52" },
    { name: "2! 3!" },
    { name: "For Youth" },
    { name: "Take Two" },
    { name: "Crystal Snow" },
    { name: "Butterfly" },
    { name: "Paradise" },
    { name: "Heartbeat" },
    { name: "Serendipity" },
    { name: "Dimple" },
    { name: "Telepathy" },
    { name: "Dis-ease" },
    { name: "Stay" }

];

let selectedSong;

function chooseSong() {

    let index = Math.floor(Math.random() * songs.length);

    selectedSong = songs[index];

    document.getElementById("song").textContent =
        "“" + selectedSong.name + "”";
}

function openSong() {

    const search =
        "https://open.spotify.com/search/" +
        encodeURIComponent(selectedSong.name + " BTS");

    window.location.href = search;

}

chooseSong();

</script>

</body>
</html>
