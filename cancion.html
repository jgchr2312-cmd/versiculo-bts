    background: #666666;
    font-family: Georgia, "Times New Roman", serif;
    color: #222222;
    padding: 20px;
}

.card {

    max-width: 430px;

    text-align: center;
    border-top: 7px solid #e9002b;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);

.heart {

    font-size: 25px;

}

h1 {
    margin: 0;
    font-family: Arial, sans-serif;

    letter-spacing: 2px;

}

.subtitle {

}

.song {

}

.artist {
    font-family: Arial, sans-serif;
    font-size: 14px;
    color: #e9002b;
    font-weight: bold;
    margin-bottom: 30px;
}

button {
    border: none;
    background: #e9002b;
    color: white;
    padding: 13px 22px;
    font-family: Arial, sans-serif;
    font-weight: bold;
    cursor: pointer;
    letter-spacing: 1px;
}

.footer {
    margin-top: 30px;
    font-family: Arial, sans-serif;
    font-size: 11px;
    color: #888888;
}

</style>
</head>

let selectedSong;

let lastSongName = "";

function chooseSong() {
    let index;

    do {
        index = Math.floor(Math.random() * songs.length);
    } while (songs.length > 1 && songs[index].name === lastSongName);

    selectedSong = songs[index];
    lastSongName = selectedSong.name;

    document.getElementById("song").textContent =
        "“" + selectedSong.name + "”";
}

function openSong() {

    if (selectedSong.url) {
        window.location.href = selectedSong.url;
    } else {
        const search =
            "https://open.spotify.com/search/" +
            encodeURIComponent(selectedSong.name + " BTS");

        window.location.href = search;
    }

}
