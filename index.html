<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Un mensaje para ti ♡</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #666666;
        font-family: Georgia, "Times New Roman", serif;
        color: #222222;
        padding: 20px;
    }

    .card {
        width: 100%;
        max-width: 430px;
        background: #eeeeee;
        padding: 42px 28px;
        text-align: center;
        border-top: 7px solid #e9002b;
        box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    }

    .heart {
        color: #e9002b;
        font-size: 25px;
        margin-bottom: 10px;
    }

    h1 {
        margin: 0;
        font-family: Arial, sans-serif;
        font-size: 25px;
        letter-spacing: 2px;
        text-transform: uppercase;
    }

    .subtitle {
        margin: 12px 0 30px;
        font-family: Arial, sans-serif;
        font-size: 13px;
        color: #666666;
    }

    .verse {
        font-size: 22px;
        line-height: 1.55;
        font-style: italic;
        margin: 20px 5px;
    }

    .reference {
        font-family: Arial, sans-serif;
        font-weight: bold;
        font-size: 14px;
        color: #e9002b;
        margin-bottom: 30px;
    }

    button {
        border: none;
        background: #e9002b;
        color: white;
        padding: 13px 22px;
        font-family: Arial, sans-serif;
        font-weight: bold;
        cursor: pointer;
        letter-spacing: 1px;
    }

    button:hover {
        background: #b90022;
    }

    .footer {
        margin-top: 30px;
        font-family: Arial, sans-serif;
        font-size: 11px;
        color: #888888;
    }
</style>
</head>

<body>

<div class="card">

    <div class="heart">♡</div>

    <h1>Un mensaje para ti</h1>

    <div class="subtitle">
        Quizás necesitabas leer esto hoy...
    </div>

    <div class="verse" id="verse"></div>

    <div class="reference" id="reference"></div>

    <button onclick="newVerse()">
        ✨ OTRO MENSAJE
    </button>

    <div class="footer">
        Que este mensaje te encuentre cuando lo necesites. ♡
    </div>

</div>

<script>

const verses = [

{
    text: "Todo lo puedo en Cristo que me fortalece.",
    reference: "Filipenses 4:13"
},

{
    text: "No temas, porque yo estoy contigo; no desmayes, porque yo soy tu Dios.",
    reference: "Isaías 41:10"
},

{
    text: "Esfuérzate y sé valiente; no temas ni desmayes.",
    reference: "Josué 1:9"
},

{
    text: "Jehová es mi pastor; nada me faltará.",
    reference: "Salmos 23:1"
},

{
    text: "Echa sobre Jehová tu carga, y él te sustentará.",
    reference: "Salmos 55:22"
},

{
    text: "Encomienda a Jehová tu camino, y confía en él; y él hará.",
    reference: "Salmos 37:5"
},

{
    text: "Porque yo sé los pensamientos que tengo acerca de vosotros, pensamientos de paz, y no de mal.",
    reference: "Jeremías 29:11"
},

{
    text: "El Señor es mi luz y mi salvación; ¿de quién temeré?",
    reference: "Salmos 27:1"
},

{
    text: "Mi paz os dejo, mi paz os doy; no os la doy como el mundo la da.",
    reference: "Juan 14:27"
},

{
    text: "Confiad en Jehová perpetuamente, porque en Jehová el Señor está la fortaleza de los siglos.",
    reference: "Isaías 26:4"
},

{
    text: "Los que esperan a Jehová tendrán nuevas fuerzas; levantarán alas como las águilas.",
    reference: "Isaías 40:31"
},

{
    text: "El amor nunca deja de ser.",
    reference: "1 Corintios 13:8"
}

];

let last = -1;

function newVerse() {

    let index;

    do {
        index = Math.floor(Math.random() * verses.length);
    } while (index === last && verses.length > 1);

    last = index;

    document.getElementById("verse").textContent =
        "“" + verses[index].text + "”";

    document.getElementById("reference").textContent =
        "— " + verses[index].reference;
}

newVerse();

</script>

</body>
</html>
